name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lua:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      # Fetched third-party libraries are not ours to check.
      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -not -path './Libs/*' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run automated tests
        run: lua5.1 tests/run.lua

      - name: Check library pins match .pkgmeta
        run: lua5.1 tools/check-libraries.lua

  fetch:
    name: Library fetch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch pinned libraries
        shell: pwsh
        run: ./tools/Fetch-Libraries.ps1

      # A second run must change nothing, and fetched files stay git-ignored.
      - name: Fetch again and confirm nothing changed
        shell: pwsh
        run: |
          $output = ./tools/Fetch-Libraries.ps1 6>&1 | Out-String
          Write-Host $output
          if ($output -match 'Fetching ') { throw 'Second fetch downloaded again.' }
          $status = git status --porcelain
          if ($status) { throw "Fetching left the working tree dirty:`n$status" }

  package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The packager reads the version and changelog from git history.
          fetch-depth: 0
          persist-credentials: false

      # The packager fetches the CurseForge library externals with svn.
      - name: Install svn
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Test the package check
        run: tests/tools/check-package.test.sh

      - name: Build and validate the multi-client package without uploading
        run: tools/build-package.sh

      # Keep the validated zip so a build can be downloaded, for example for a
      # manual CurseForge upload.
      - name: Keep the package as a download
        uses: actions/upload-artifact@v4
        with:
          name: AsgardsGuildFellowship-package
          path: .release/AsgardsGuildFellowship-*.zip
          if-no-files-found: error
          # The package is written to .release/, a hidden directory.
          include-hidden-files: true
          retention-days: 30
